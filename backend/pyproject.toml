[project]
name = "books-for-your-pocket"
version = "0.1.0"
description = ""
authors = [
    {name = "Edson"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.162.2,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.0,<2.1)",
    "alembic (>=1.20.1,<2.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "psycopg[binary] (>=3.3.8,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.17.4,<0.18.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
